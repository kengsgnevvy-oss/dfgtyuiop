name: Cloud License Generator
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ALF File
        run: |
          docker run --rm \
            -v $(pwd):/output \
            gableroux/unity3d:2018.1.3f1-windows \
            bash -c "/opt/Unity/Editor/Unity -batchmode -nographics -createManualActivationFile -quit -logfile /dev/stdout || true; cp \$(find / -name '*.alf' -type f 2>/dev/null | head -1) /output/activation_request.alf"
          
      - name: Upload ALF File
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-ALF-File
          path: activation_request.alf

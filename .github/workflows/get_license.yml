name: Cloud License Generator
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ALF File
        run: |
          # Собираем системную информацию для MachineID
          MACHINE_ID=$(cat /etc/machine-id 2>/dev/null || cat /var/lib/dbus/machine-id 2>/dev/null || echo "unknown")
          
          # Создаем правильный XML для Unity 2018
          cat > activation_request.alf << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
              <Request>
                  <MachineID>${MACHINE_ID}</MachineID>
                  <Version>2018.1.3f1</Version>
                  <Platform>Linux</Platform>
                  <RequestType>ManualActivation</RequestType>
                  <RequestDate>$(date -u +%Y-%m-%dT%H:%M:%SZ)</RequestDate>
              </Request>
          </root>
          EOF
          
          echo "ALF file content:"
          cat activation_request.alf
          
      - name: Upload ALF File
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-ALF-File
          path: activation_request.alf
